
[functions.google-token-refresh]
enabled = true
verify_jwt = true
import_map = "./functions/google-token-refresh/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/google-token-refresh/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/google-token-refresh/*.html" ]

[functions.send-backup-reminder]
enabled = true
# Auth is enforced inside the function via a shared x-cron-secret header (BACKUP_REMINDER_CRON_SECRET),
# not a user JWT — this function is only ever invoked by the scheduled cron job, never the app.
verify_jwt = false
import_map = "./functions/send-backup-reminder/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-backup-reminder/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-backup-reminder/*.html" ]

[functions.welcome-email]
enabled = true
# verify_jwt = false: the platform JWT gate accepts any valid JWT, including
# the anon key shipped in the app — useless as auth here. This function is a
# trigger-invoked webhook authenticated by its own constant-time shared-secret
# check (WELCOME_EMAIL_SERVICE_KEY vs the Vault token the trigger sends), the
# same pattern as send-backup-reminder's x-cron-secret. Turning the gate off
# lets that secret be a plain random string rather than a JWT-shaped token.
verify_jwt = false
import_map = "./functions/welcome-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/welcome-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/welcome-email/*.html" ]
