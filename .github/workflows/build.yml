name: Build APK and AAB
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            gradle-
      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          mkdir -p android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      - name: Check Supabase secrets are present
        run: |
          if [ -z "${EXPO_PUBLIC_SUPABASE_URL// /}" ]; then
            echo "SUPABASE_URL secret is empty or unset — aborting before build" >&2
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY// /}" ]; then
            echo "SUPABASE_ANON_KEY secret is empty or unset — aborting before build" >&2
            exit 1
          fi
          echo "SUPABASE_URL length: ${#EXPO_PUBLIC_SUPABASE_URL}"
          echo "SUPABASE_ANON_KEY length: ${#EXPO_PUBLIC_SUPABASE_ANON_KEY}"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Prebuild
        run: npx expo prebuild --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export --platform android --output-dir dist
          BUNDLE_FILE=$(find dist/_expo/static/js/android -type f \( -name "*.hbc" -o -name "*.js" \) | head -n1)
          if [ -z "$BUNDLE_FILE" ]; then
            echo "No bundle output found from expo export" >&2
            exit 1
          fi
          cp "$BUNDLE_FILE" android/app/src/main/assets/index.android.bundle
          if ! grep -aq "supabase.co" android/app/src/main/assets/index.android.bundle; then
            echo "Bundled JS does not contain a Supabase URL — EXPO_PUBLIC_SUPABASE_URL was likely empty at export time" >&2
            exit 1
          fi
          if ! grep -aq "${EXPO_PUBLIC_SUPABASE_ANON_KEY:0:20}" android/app/src/main/assets/index.android.bundle; then
            echo "Bundled JS does not contain the Supabase anon key — EXPO_PUBLIC_SUPABASE_ANON_KEY was likely empty or wrong at export time" >&2
            exit 1
          fi
          cp assets/adi-registration.properties android/app/src/main/assets/adi-registration.properties
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/savr.keystore
      - name: Build signed APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/savr.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      - name: Build signed AAB
        run: |
          cd android && ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/savr.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: savr-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: savr-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7